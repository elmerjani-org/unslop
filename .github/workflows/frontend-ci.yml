name: Frontend CI
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup node.js
        uses: actions/setup-node@v7.1.0

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test
        
